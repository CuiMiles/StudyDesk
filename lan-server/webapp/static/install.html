<!doctype html>
<html lang="zh-CN">
<head>

  <title>安装 StudyDesk</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4f8;color:#1e293b;font:16px/1.6 system-ui,-apple-system,sans-serif}
    main{width:min(100% - 32px,440px);padding:30px;border:1px solid #e2e8f0;border-radius:22px;background:#fff;box-shadow:0 16px 44px #1e293b12}

    small{display:block;color:#64748b;margin-top:18px}small a{display:inline;background:none;color:#33498f;padding:0;font-weight:500;text-decoration:underline}

</head>
<body><main>
  <h1>StudyDesk</h1>
  <p>在手机上安装局域网学习应用。</p>

  <small>首次安装后输入这台服务器的局域网地址。以后在应用“设置”中点“检查应用更新”。学习内容由服务器同步，网页更新会直接生效。</small>
